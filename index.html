<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Facade Runner v0.2</title>
<style>
html,body{
  margin:0;height:100%;overflow:hidden;background:#07090d;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  touch-action:none;overscroll-behavior:none;
}
body{display:grid;place-items:center}
canvas{
  display:block;
  width:min(100vw,520px);
  height:min(100vh,980px);
  background:#10131a;
  box-shadow:0 0 40px #000;
}
#tip{
  position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  color:#eee;background:#000b;border:1px solid #ffffff28;
  border-radius:14px;padding:7px 10px;font-size:11px;
  white-space:nowrap;pointer-events:none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tip">swipe ← → pas • swipe ↑ skok • swipe ↓ ślizg</div>

<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(2, devicePixelRatio || 1);

let W=390,H=844;
function resize(){
  const cw=Math.min(innerWidth,520);
  const ch=Math.min(innerHeight,980);
  canvas.width=Math.round(cw*DPR);
  canvas.height=Math.round(ch*DPR);
  canvas.style.width=cw+'px';
  canvas.style.height=ch+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W=cw;H=ch;
}
addEventListener('resize',resize);
resize();

/*
  ZASADA ŚWIATA:
  - elewacja jest podłogą gracza
  - ulica jest pionową ścianą po LEWEJ
  - cała scenografia miejska pozostaje normalna względem ulicy,
    ale z perspektywy gracza świat jest obrócony o 90°
*/

const lanes=[-0.26,0,0.26];
const player={
  lane:1,laneX:0,
  jump:0,jumpV:0,
  sliding:false,slideT:0,
  bob:0
};

let t=0, runTime=0, dist=0, score=0, coins=0;
let speed=0.46;
let gameOver=false, finished=false;
let objects=[];
let worldEvents=[];
let nextEvent=0;
let cameraTilt=0,cameraShake=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function persp(z){
  z=clamp(z,0,1);
  const p=z*z;
  const y=lerp(H*0.90,H*0.18,p);
  const width=lerp(W*0.88,W*0.17,p);
  return {y,width,p};
}
function laneX(norm,z){
  const p=persp(z);
  return W*0.61 + norm*p.width;
}

function buildTrack(){
  // ok. 60 s: konkretna sekwencja "vertical slice"
  const seq = [
    [2.0,'coins',1],
    [4.0,'window',0],
    [6.2,'coins',2],
    [8.0,'ac',1],
    [10.0,'window',2],
    [12.0,'coins',0],
    [14.0,'balcony',1],
    [16.0,'gap',null],
    [18.8,'coins',2],
    [21.0,'window',0],
    [23.0,'ac',2],
    [25.0,'coins',1],
    [27.0,'balcony',0],
    [29.0,'window',2],
    [31.5,'streetGap',null],   // skrzyżowanie
    [35.0,'coins',1],
    [37.0,'ac',0],
    [39.0,'window',2],
    [41.0,'coins',0],
    [43.0,'balcony',2],
    [45.0,'gap',null],
    [48.0,'coins',1],
    [50.0,'window',0],
    [52.0,'ac',1],
    [54.0,'window',2],
    [56.0,'coins',2],
    [58.0,'streetGap',null]
  ];
  worldEvents=seq.map(([time,type,lane])=>({time,type,lane}));
  nextEvent=0;
}
buildTrack();

function reset(){
  t=0;runTime=0;dist=0;score=0;coins=0;speed=.46;
  gameOver=false;finished=false;
  objects=[];nextEvent=0;
  player.lane=1;player.laneX=0;player.jump=0;player.jumpV=0;
  player.sliding=false;player.slideT=0;
  cameraTilt=0;cameraShake=0;
}
reset();

function addEvent(ev){
  if(ev.type==='coins'){
    for(let i=0;i<5;i++){
      objects.push({type:'coin',lane:ev.lane,z:1.02+i*0.07,taken:false});
    }
  }else if(ev.type==='gap'){
    objects.push({type:'gap',z:1.02,hit:false});
  }else if(ev.type==='streetGap'){
    objects.push({type:'streetGap',z:1.02,hit:false});
  }else{
    objects.push({type:'ob',kind:ev.type,lane:ev.lane,z:1.02,hit:false});
  }
}

function input(dir){
  if(gameOver||finished){reset();return;}
  if(dir==='left') player.lane=Math.max(0,player.lane-1);
  if(dir==='right') player.lane=Math.min(2,player.lane+1);
  if(dir==='up' && player.jump<0.001){
    player.jump=.001;player.jumpV=.038;
  }
  if(dir==='down' && player.jump<.025){
    player.sliding=true;player.slideT=.48;
  }
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a') input('left');
  if(e.key==='ArrowRight'||e.key==='d') input('right');
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ') input('up');
  if(e.key==='ArrowDown'||e.key==='s') input('down');
});

let sx=0,sy=0;
canvas.addEventListener('pointerdown',e=>{
  sx=e.clientX;sy=e.clientY;
  try{canvas.setPointerCapture(e.pointerId)}catch{}
});
canvas.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy;
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(Math.max(ax,ay)<20){
    if(gameOver||finished) reset();
    return;
  }
  if(ax>ay) input(dx<0?'left':'right');
  else input(dy<0?'up':'down');
});

function update(dt){
  if(gameOver||finished) return;

  t+=dt;runTime+=dt;
  speed=Math.min(.74,.46+runTime*.0045);
  dist+=speed*dt*15;
  score=Math.floor(dist*4+coins*30);

  // sekwencja 60 s
  while(nextEvent<worldEvents.length && runTime>=worldEvents[nextEvent].time){
    addEvent(worldEvents[nextEvent]);
    nextEvent++;
  }
  if(runTime>=60){
    finished=true;
    return;
  }

  // płynna zmiana pasa + lekki "bank" kamery
  const target=lanes[player.lane];
  const diff=target-player.laneX;
  player.laneX+=diff*Math.min(1,dt*10.5);
  cameraTilt=lerp(cameraTilt,diff*0.45,Math.min(1,dt*8));

  // skok
  if(player.jump>0 || player.jumpV>0){
    player.jump+=player.jumpV;
    player.jumpV-=dt*.112;
    if(player.jump<=0){
      if(player.jumpV<0) cameraShake=.18;
      player.jump=0;player.jumpV=0;
    }
  }
  // ślizg
  if(player.sliding){
    player.slideT-=dt;
    if(player.slideT<=0) player.sliding=false;
  }

  cameraShake=Math.max(0,cameraShake-dt*.9);
  player.bob+=dt*(9+speed*8);

  // obiekty jadą ku graczowi
  for(const o of objects){
    o.z-=speed*dt*.32;

    if(o.z<.12 && o.z>.025){
      if(o.type==='coin' && !o.taken){
        if(Math.abs(lanes[o.lane]-player.laneX)<.13){
          o.taken=true;coins++;
        }
      }
      if(o.type==='ob' && !o.hit){
        if(Math.abs(lanes[o.lane]-player.laneX)<.13){
          let safe=false;
          if(o.kind==='balcony') safe=player.sliding;
          else safe=player.jump>.07 || player.sliding;
          if(!safe){
            o.hit=true;gameOver=true;cameraShake=.35;
          }
        }
      }
      if((o.type==='gap'||o.type==='streetGap') && !o.hit){
        const need=o.type==='streetGap' ? .085 : .055;
        if(player.jump<need){
          o.hit=true;gameOver=true;cameraShake=.35;
        }
      }
    }
  }
  objects=objects.filter(o=>o.z>-.10 && !(o.type==='coin'&&o.taken));
}

function comicText(txt,x,y,size,align='left',fill='#f4eedf'){
  ctx.save();
  ctx.font=`900 ${size}px system-ui`;
  ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.strokeStyle='#07080b';
  ctx.lineWidth=Math.max(3,size*.13);
  ctx.strokeText(txt,x,y);ctx.fillStyle=fill;ctx.fillText(txt,x,y);
  ctx.restore();
}

function drawWorld(){
  ctx.save();

  // camera feeling
  const shake=(Math.random()-.5)*cameraShake*12;
  ctx.translate(shake,shake*.3);
  ctx.rotate(cameraTilt*.02);

  // tło/noir
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#07101a');
  bg.addColorStop(.55,'#17202a');
  bg.addColorStop(1,'#050608');
  ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);

  // PIONOWA ULICA - LEWA ŚCIANA
  const streetW=W*.26;
  ctx.fillStyle='#151920';ctx.fillRect(0,0,streetW,H);
  ctx.fillStyle='#2a2e35';ctx.fillRect(streetW*.66,0,streetW*.34,H);

  // pasy drogowe: "w górę/dół" ekranu, czyli ulica jest pionowa
  ctx.fillStyle='#d9d1c0';
  const scroll=(t*70)%78;
  for(let y=-80+scroll;y<H+80;y+=78){
    ctx.fillRect(streetW*.22,y,streetW*.065,28);
    ctx.fillRect(streetW*.47,y+20,streetW*.055,24);
  }

  // samochody po ulicy, obrócone 90° względem bohatera
  for(let i=0;i<8;i++){
    const yy=((i*135 + t*(i%2?42:-35))%(H+180))-90;
    const xx=streetW*(i%2?.19:.46);
    ctx.save();
    ctx.translate(xx,yy);
    ctx.rotate(Math.PI/2);
    ctx.fillStyle=['#c43d2c','#d2a63b','#4e6475','#666'][i%4];
    ctx.fillRect(-12,-23,24,46);
    ctx.fillStyle='#9ab9c7';
    ctx.fillRect(-8,-12,16,18);
    ctx.restore();
  }

  // drzewa + latarnie - również normalne względem ulicy
  for(let i=0;i<6;i++){
    const yy=(i*165+70)%H;
    ctx.fillStyle='#263a2e';
    ctx.beginPath();ctx.arc(streetW*.78,yy,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0d1115';ctx.fillRect(streetW*.84,yy-2,streetW*.14,4);
    ctx.fillStyle='#efc66e';ctx.beginPath();ctx.arc(streetW*.98,yy,5,0,Math.PI*2);ctx.fill();
  }

  // ELEWACJA = PODŁOGA GRACZA
  const floorLeft=streetW*.80;
  const hy=H*.18;
  ctx.fillStyle='#b08761';
  ctx.beginPath();
  ctx.moveTo(floorLeft,H);
  ctx.lineTo(W,H);
  ctx.lineTo(W*.69,hy);
  ctx.lineTo(streetW,hy);
  ctx.closePath();ctx.fill();

  // fugowanie elewacji
  for(let i=0;i<14;i++){
    const z=i/13;
    const p=persp(z);
    ctx.strokeStyle='#5c483a88';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(floorLeft,p.y);ctx.lineTo(W,p.y);ctx.stroke();
  }
  for(const n of [-.42,-.18,.05,.28,.5]){
    const a=persp(0),b=persp(1);
    ctx.strokeStyle='#6a514188';
    ctx.beginPath();
    ctx.moveTo(laneX(n,0),a.y);
    ctx.lineTo(laneX(n,1),b.y);
    ctx.stroke();
  }

  // stałe detale fasady
  for(let i=0;i<10;i++){
    const z=((i*.12 + t*speed*.04)%1);
    const p=persp(z);
    const s=10+(1-z)*23;
    const x=laneX(i%2?-.48:.48,z);
    ctx.fillStyle='#1a2026';ctx.strokeStyle='#080a0d';ctx.lineWidth=3;
    ctx.fillRect(x-s,p.y-s*.5,s*1.45,s*.76);
    ctx.strokeRect(x-s,p.y-s*.5,s*1.45,s*.76);
    ctx.fillStyle='#d58b46';
    ctx.fillRect(x-s*.8,p.y-s*.36,s*1.0,s*.40);
  }

  drawObjects();

  // winieta + raster
  const vg=ctx.createRadialGradient(W*.60,H*.55,60,W*.60,H*.55,Math.max(W,H)*.78);
  vg.addColorStop(.55,'#0000');vg.addColorStop(1,'#000b');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.10;ctx.fillStyle='#000';
  for(let y=0;y<H;y+=7){
    for(let x=0;x<W;x+=7){
      ctx.beginPath();ctx.arc(x,y,1.05,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  ctx.restore();
}

function drawObjects(){
  const list=[...objects].sort((a,b)=>b.z-a.z);
  for(const o of list){
    if(o.z<0||o.z>1.18) continue;
    const z=clamp(o.z,0,1),p=persp(z);
    const s=(1-z)*1.14+.15;

    if(o.type==='coin'){
      const x=laneX(lanes[o.lane],z);
      ctx.save();ctx.translate(x,p.y);
      ctx.scale(s,s);
      ctx.fillStyle='#ffbf2f';ctx.strokeStyle='#492600';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff0a8';
      ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('★',0,1);
      ctx.restore();
      continue;
    }

    if(o.type==='gap'||o.type==='streetGap'){
      const depth=o.type==='streetGap'?.095:.055;
      const p2=persp(clamp(z-depth,0,1));
      ctx.fillStyle='#050608';
      ctx.beginPath();
      ctx.moveTo(W*.245,p.y-10);
      ctx.lineTo(W,p.y-10);
      ctx.lineTo(W,p2.y+13);
      ctx.lineTo(W*.25,p2.y+13);
      ctx.closePath();ctx.fill();

      if(o.type==='streetGap'){
        // skrzyżowanie - fragment poprzecznej ulicy w przerwie
        ctx.fillStyle='#181c22';
        const yy=(p.y+p2.y)/2;
        ctx.fillRect(W*.25,yy-10,W*.75,20);
        ctx.fillStyle='#d7d0c0';
        for(let x=W*.30;x<W;x+=34) ctx.fillRect(x,yy-2,18,4);
      }
      continue;
    }

    const x=laneX(lanes[o.lane],z);
    const w=48*s,h=32*s;
    ctx.save();ctx.translate(x,p.y);

    if(o.kind==='window'){
      ctx.fillStyle='#111820';ctx.strokeStyle='#050608';ctx.lineWidth=4*s;
      ctx.fillRect(-w/2,-h*.55,w,h);ctx.strokeRect(-w/2,-h*.55,w,h);
      ctx.save();ctx.translate(w*.34,-h*.2);ctx.rotate(-.62);
      ctx.fillStyle='#6d7d86';ctx.fillRect(0,-h*.44,w*.10,h*.88);
      ctx.restore();
    }else if(o.kind==='ac'){
      ctx.fillStyle='#737980';ctx.strokeStyle='#111';ctx.lineWidth=4*s;
      ctx.fillRect(-w/2,-h*.55,w,h);ctx.strokeRect(-w/2,-h*.55,w,h);
      ctx.fillStyle='#222';
      ctx.beginPath();ctx.arc(0,-h*.05,h*.30,0,Math.PI*2);ctx.fill();
    }else if(o.kind==='balcony'){
      ctx.fillStyle='#34373b';ctx.strokeStyle='#0a0b0d';ctx.lineWidth=4*s;
      ctx.fillRect(-w*.62,-h*.68,w*1.24,h*.32);
      ctx.strokeRect(-w*.62,-h*.68,w*1.24,h*.32);
      for(let i=-2;i<=2;i++){
        ctx.fillRect(i*w*.18,-h*.36,4*s,h*.72);
      }
    }
    ctx.restore();
  }
}

function drawPlayer(){
  const x=laneX(player.laneX,0.04);
  const jumpPx=player.jump*H*1.08;
  const bob=player.jump===0&&!player.sliding?Math.sin(player.bob)*2:0;
  const y=H*.79-jumpPx+bob;

  ctx.save();ctx.translate(x,y);
  ctx.lineCap='round';ctx.lineJoin='round';

  // cień
  ctx.fillStyle='#0007';
  ctx.beginPath();ctx.ellipse(0,49+jumpPx,28,8,0,0,Math.PI*2);ctx.fill();

  // tułów
  ctx.fillStyle='#a92b27';ctx.strokeStyle='#08090b';ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(-15,-30);ctx.quadraticCurveTo(0,-42,16,-30);
  ctx.lineTo(20,10);ctx.quadraticCurveTo(0,25,-20,10);
  ctx.closePath();ctx.fill();ctx.stroke();

  // głowa
  ctx.fillStyle='#16120f';
  ctx.beginPath();ctx.arc(0,-47,13,0,Math.PI*2);ctx.fill();ctx.stroke();

  // plecak
  ctx.fillStyle='#222a31';
  ctx.fillRect(-10,-28,21,24);ctx.strokeRect(-10,-28,21,24);

  // nogi
  if(player.sliding){
    drawLimb(-6,15,-28,30,12,'#16181d');
    drawLimb(8,14,28,25,12,'#16181d');
    drawLimb(-28,30,-37,33,8,'#e9e5dc');
    drawLimb(28,25,38,27,8,'#e9e5dc');
  }else{
    const step=Math.sin(player.bob);
    drawLimb(-5,14,-12-step*3,43,12,'#16181d');
    drawLimb(8,13,13+step*3,45,12,'#16181d');
    drawLimb(-12-step*3,43,-19-step*3,51,8,'#e9e5dc');
    drawLimb(13+step*3,45,20+step*3,52,8,'#e9e5dc');
  }

  drawLimb(-14,-20,-29,4,8,'#a92b27');
  drawLimb(14,-20,29,-2,8,'#a92b27');
  ctx.restore();
}
function drawLimb(x1,y1,x2,y2,w,c){
  ctx.strokeStyle=c;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}

function drawUI(){
  ctx.fillStyle='#050608c8';ctx.fillRect(12,12,134,101);
  comicText('WYNIK',24,30,14,'left','#f4eedf');
  comicText(String(score).padStart(4,'0'),24,56,30,'left','#ffbd35');
  comicText('● '+coins,24,88,17,'left','#f4eedf');
  comicText(Math.floor(dist)+' m',88,88,16,'left','#f4eedf');

  // progress 60 s
  const pw=W-40,px=20,py=124;
  ctx.fillStyle='#000a';ctx.fillRect(px,py,pw,8);
  ctx.fillStyle='#ffbd35';ctx.fillRect(px,py,pw*clamp(runTime/60,0,1),8);

  // pause icon dekoracyjny
  ctx.fillStyle='#050608c9';ctx.fillRect(W-58,14,44,44);
  ctx.fillStyle='#eee';ctx.fillRect(W-46,24,7,24);ctx.fillRect(W-32,24,7,24);

  if(gameOver){
    ctx.fillStyle='#000d';ctx.fillRect(0,0,W,H);
    comicText('KONIEC BIEGU',W/2,H*.42,34,'center','#ffbd35');
    comicText('dotknij, aby zacząć od nowa',W/2,H*.49,15,'center','#f4eedf');
  }
  if(finished){
    ctx.fillStyle='#000d';ctx.fillRect(0,0,W,H);
    comicText('KONIEC TESTU',W/2,H*.40,34,'center','#ffbd35');
    comicText('60 sekund trasy ukończone',W/2,H*.47,16,'center','#f4eedf');
    comicText('dotknij, aby zagrać ponownie',W/2,H*.52,14,'center','#f4eedf');
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawWorld();
  drawPlayer();
  drawUI();
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.035,(now-last)/1000);
  last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
