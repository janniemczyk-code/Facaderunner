<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c12">
<title>Facade Runner — prototyp</title>
<style>
  html,body{margin:0;height:100%;background:#090b10;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{touch-action:none;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:#090b10}
  canvas{
    width:min(100vw,520px);
    height:min(100vh,980px);
    max-width:100vw;max-height:100vh;
    display:block;background:#111;
    box-shadow:0 0 40px #000;
  }
  #hint{
    position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    color:#f6f1df;background:#000b;border:1px solid #fff4;
    padding:8px 12px;border-radius:14px;font-size:12px;letter-spacing:.2px;
    pointer-events:none;white-space:nowrap;opacity:.9
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hint">←/→ pas • ↑ skok • ↓ ślizg • na telefonie: swipe</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(2, window.devicePixelRatio || 1);

  let W=390,H=844,scale=1;
  function resize(){
    const cssW = Math.min(innerWidth, 520);
    const cssH = Math.min(innerHeight, 980);
    canvas.width = Math.round(cssW*DPR);
    canvas.height = Math.round(cssH*DPR);
    canvas.style.width = cssW+'px';
    canvas.style.height = cssH+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    W=cssW; H=cssH;
    scale = Math.min(W/390,H/844);
  }
  addEventListener('resize', resize); resize();

  // ---- zasada świata ----
  // Elewacja jest "podłogą" gracza. Ulica jest pionową ścianą po LEWEJ.
  // Cała normalna scenografia uliczna jest obrócona o 90° względem gracza.

  const lanes = [-0.28, 0, 0.28];
  const player = {
    lane:1, laneX:0, y:H*0.77,
    jump:0, jumpV:0, sliding:false, slideT:0
  };

  let gameOver=false, started=true;
  let t=0, speed=0.42, dist=0, score=0, coins=0;
  let objects=[];
  let spawnT=0;

  const rnd=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function reset(){
    t=0; speed=.42; dist=0; score=0; coins=0; gameOver=false;
    player.lane=1; player.laneX=lanes[1]; player.jump=0; player.jumpV=0; player.sliding=false; player.slideT=0;
    objects=[]; spawnT=.5;
  }

  // Perspective: z=0 blisko gracza, z=1 horyzont
  function persp(z){
    z=clamp(z,0,1);
    const p = z*z;
    const centerX = W*0.60;
    const nearW = W*0.88;
    const farW = W*0.18;
    const width = nearW*(1-p)+farW*p;
    const y = H*0.91*(1-p)+H*0.19*p;
    return {y,width,centerX,p};
  }
  function laneScreenX(laneNorm,z){
    const p=persp(z);
    return p.centerX + laneNorm*p.width;
  }

  function spawn(){
    const r=Math.random();
    if(r<0.48){
      // obstacle
      const kind = Math.random()<0.55 ? 'window' : 'ac';
      const lane = Math.floor(Math.random()*3);
      objects.push({type:'ob',kind,lane,z:1.03,hit:false});
      if(Math.random()<0.55){
        // add coin trail in another lane
        let safe=(lane+1+Math.floor(Math.random()*2))%3;
        for(let i=0;i<4;i++) objects.push({type:'coin',lane:safe,z:1.12+i*0.08,taken:false});
      }
    } else if(r<0.78){
      const lane=Math.floor(Math.random()*3);
      for(let i=0;i<5;i++) objects.push({type:'coin',lane,z:1.03+i*0.075,taken:false});
    } else {
      // gap - requires jump
      objects.push({type:'gap',z:1.04,hit:false});
      const lane=Math.floor(Math.random()*3);
      for(let i=0;i<4;i++) objects.push({type:'coin',lane,z:1.13+i*0.07,taken:false});
    }
  }

  function input(dir){
    if(gameOver){ reset(); return; }
    if(dir==='left') player.lane=Math.max(0,player.lane-1);
    if(dir==='right') player.lane=Math.min(2,player.lane+1);
    if(dir==='up' && player.jump<=0.001){ player.jumpV=0.036; player.jump=0.001; }
    if(dir==='down' && player.jump<0.03){ player.sliding=true; player.slideT=.55; }
  }
  addEventListener('keydown',e=>{
    if(['ArrowLeft','a','A'].includes(e.key)) input('left');
    if(['ArrowRight','d','D'].includes(e.key)) input('right');
    if(['ArrowUp','w','W',' '].includes(e.key)) input('up');
    if(['ArrowDown','s','S'].includes(e.key)) input('down');
  });

  let sx=0,sy=0,st=0;
  canvas.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; st=performance.now(); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup',e=>{
    const dx=e.clientX-sx, dy=e.clientY-sy;
    const ax=Math.abs(dx), ay=Math.abs(dy);
    if(Math.max(ax,ay)<22){ if(gameOver) reset(); return; }
    if(ax>ay) input(dx<0?'left':'right');
    else input(dy<0?'up':'down');
  });

  function update(dt){
    if(gameOver) return;
    t += dt;
    speed = Math.min(0.78, speed + dt*0.004);
    dist += speed*dt*14;
    score = Math.floor(dist*3 + coins*25);

    const target=lanes[player.lane];
    player.laneX += (target-player.laneX)*Math.min(1,dt*10);

    if(player.jump>0 || player.jumpV>0){
      player.jump += player.jumpV;
      player.jumpV -= dt*0.11;
      if(player.jump<=0){ player.jump=0; player.jumpV=0; }
    }
    if(player.sliding){
      player.slideT-=dt;
      if(player.slideT<=0) player.sliding=false;
    }

    spawnT-=dt;
    if(spawnT<=0){ spawn(); spawnT=rnd(.65,1.15)/speed; }

    for(const o of objects){
      o.z -= speed*dt*0.32;
      // collisions around player depth
      if(o.z<0.12 && o.z>0.02){
        if(o.type==='coin' && !o.taken){
          if(Math.abs(lanes[o.lane]-player.laneX)<0.12){
            o.taken=true; coins++;
          }
        }
        if(o.type==='ob' && !o.hit){
          if(Math.abs(lanes[o.lane]-player.laneX)<0.12){
            const safe = player.jump>0.075 || player.sliding;
            if(!safe){ o.hit=true; gameOver=true; }
          }
        }
        if(o.type==='gap' && !o.hit){
          if(player.jump<0.06){ o.hit=true; gameOver=true; }
        }
      }
    }
    objects=objects.filter(o=>o.z>-0.08 && !(o.type==='coin'&&o.taken));
  }

  function line(x1,y1,x2,y2,w,c){
    ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  function comicText(txt,x,y,size,align='left',fill='#f5f0df'){
    ctx.save();
    ctx.font=`900 ${size}px system-ui`;
    ctx.textAlign=align; ctx.textBaseline='middle';
    ctx.lineJoin='round'; ctx.strokeStyle='#090b10';ctx.lineWidth=Math.max(3,size*.14);
    ctx.strokeText(txt,x,y); ctx.fillStyle=fill; ctx.fillText(txt,x,y); ctx.restore();
  }

  function drawBackground(){
    // noir sky
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#0b1220'); g.addColorStop(.55,'#1a2230'); g.addColorStop(1,'#07080b');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // VERTICAL STREET WALL on left
    const streetW=W*.26;
    ctx.fillStyle='#171b22';ctx.fillRect(0,0,streetW,H);
    // sidewalk edge
    ctx.fillStyle='#2b2f36';ctx.fillRect(streetW*.68,0,streetW*.32,H);
    // road markings perpendicular because street is rotated
    ctx.fillStyle='#d9d3c5';
    for(let y=-40+(t*80)%70;y<H+50;y+=70){
      ctx.fillRect(streetW*.27,y,streetW*.07,26);
    }
    // cars on vertical wall, oriented sideways relative to player
    for(let i=0;i<7;i++){
      const yy=(i*155 + (t*45*(i%2?1:-1)))%(H+180)-90;
      const xx=streetW*(i%2?0.22:0.50);
      ctx.save();ctx.translate(xx,yy);ctx.rotate(Math.PI/2);
      ctx.fillStyle=i%3===0?'#d34a2f':i%3===1?'#d5a43d':'#53697b';
      ctx.fillRect(-13,-24,26,48);
      ctx.fillStyle='#a7c7d7';ctx.fillRect(-9,-14,18,20);
      ctx.restore();
    }
    // trees/lamps attached to street wall
    for(let i=0;i<6;i++){
      const yy=(i*170+65)%H;
      ctx.fillStyle='#263b2e';ctx.beginPath();ctx.arc(streetW*.76,yy,16,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#101316';ctx.fillRect(streetW*.83,yy-2,streetW*.16,4);
      ctx.fillStyle='#f1c76b';ctx.beginPath();ctx.arc(streetW*.98,yy,5,0,Math.PI*2);ctx.fill();
    }

    // facade floor perspective
    const horizonY=H*.18, floorLeft=streetW*.78;
    ctx.fillStyle='#b38b63';
    ctx.beginPath();
    ctx.moveTo(floorLeft,H); ctx.lineTo(W,H); ctx.lineTo(W*.69,horizonY); ctx.lineTo(streetW,horizonY); ctx.closePath();ctx.fill();

    // tile/brick lines
    ctx.strokeStyle='#5b4637';ctx.lineWidth=1;
    for(let i=0;i<14;i++){
      const z=i/13, p=persp(z);
      line(floorLeft+(p.y/H)*0, p.y, W, p.y, 1,'#5d493a88');
    }
    for(const ln of [-.42,-.18,.05,.28,.5]){
      const a=persp(0),b=persp(1);
      line(laneScreenX(ln,0),a.y,laneScreenX(ln,1),b.y,1,'#6b524188');
    }

    // facade windows / details = objects embedded in floor
    for(let i=0;i<11;i++){
      const z=((i*.11 + (t*speed*.05))%1);
      const p=persp(z);
      const s=10+(1-z)*24;
      const x=laneScreenX((i%2?-.48:.47),z);
      ctx.fillStyle='#20252b';ctx.strokeStyle='#0c0f13';ctx.lineWidth=3;
      ctx.fillRect(x-s,p.y-s*.55,s*1.55,s*.8);ctx.strokeRect(x-s,p.y-s*.55,s*1.55,s*.8);
      ctx.fillStyle='#e19c54';ctx.fillRect(x-s*.78,p.y-s*.4,s*1.1,s*.45);
    }

    // comic vignette / halftone
    const grd=ctx.createRadialGradient(W*.58,H*.55,80,W*.58,H*.55,Math.max(W,H)*.75);
    grd.addColorStop(.55,'#0000'); grd.addColorStop(1,'#000a');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.10;ctx.fillStyle='#000';
    for(let y=0;y<H;y+=7) for(let x=0;x<W;x+=7){ ctx.beginPath();ctx.arc(x,y,1.1,0,Math.PI*2);ctx.fill(); }
    ctx.globalAlpha=1;
  }

  function drawObjects(){
    // far to near
    const list=[...objects].sort((a,b)=>b.z-a.z);
    for(const o of list){
      if(o.z<0 || o.z>1.15) continue;
      const z=clamp(o.z,0,1), p=persp(z);
      const s=(1-z)*1.15+.16;
      if(o.type==='coin'){
        const x=laneScreenX(lanes[o.lane],z);
        ctx.save();ctx.translate(x,p.y-player.jump*120*(1-z*.4));
        ctx.scale(s,s);
        ctx.fillStyle='#ffbf2f';ctx.strokeStyle='#4e2a00';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.stroke();
        ctx.fillStyle='#fff0a8';ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1);
        ctx.restore();
      } else if(o.type==='ob'){
        const x=laneScreenX(lanes[o.lane],z);
        const w=48*s,h=32*s;
        ctx.save();ctx.translate(x,p.y);
        if(o.kind==='window'){
          ctx.fillStyle='#111820';ctx.strokeStyle='#050608';ctx.lineWidth=4*s;
          ctx.fillRect(-w/2,-h*.55,w,h);ctx.strokeRect(-w/2,-h*.55,w,h);
          ctx.save();ctx.translate(w*.35,-h*.2);ctx.rotate(-.65);ctx.fillStyle='#6c7b82';ctx.fillRect(0,-h*.45,w*.08,h*.9);ctx.restore();
        }else{
          ctx.fillStyle='#70757b';ctx.strokeStyle='#111';ctx.lineWidth=4*s;
          ctx.fillRect(-w/2,-h*.55,w,h);ctx.strokeRect(-w/2,-h*.55,w,h);
          ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,-h*.05,h*.3,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle='#8b8f93';ctx.lineWidth=2*s;
          for(let a=0;a<6;a++){ const ang=a*Math.PI/3;line(0,-h*.05,Math.cos(ang)*h*.27,-h*.05+Math.sin(ang)*h*.27,2*s,'#8b8f93');}
        }
        ctx.restore();
      } else if(o.type==='gap'){
        const y=p.y, p2=persp(clamp(z-.055,0,1));
        ctx.fillStyle='#060709';
        ctx.beginPath();ctx.moveTo(W*.245,y-10);ctx.lineTo(W,y-10);ctx.lineTo(W,p2.y+12);ctx.lineTo(W*.25,p2.y+12);ctx.closePath();ctx.fill();
        ctx.fillStyle='#d2a45e';
        ctx.fillRect(W*.245,y-13,W*.755,4);
      }
    }
  }

  function drawPlayer(){
    const p=persp(0.04);
    const x=laneScreenX(player.laneX,0.04);
    const jumpPx=player.jump*H*1.1;
    const y=H*.79-jumpPx;
    ctx.save();ctx.translate(x,y);
    const sliding=player.sliding;
    ctx.lineCap='round';ctx.lineJoin='round';
    // shadow
    ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,48+jumpPx,28,8,0,0,Math.PI*2);ctx.fill();
    // body
    ctx.strokeStyle='#0a0b0d';ctx.lineWidth=5;
    ctx.fillStyle='#b62d28';
    ctx.beginPath();
    ctx.moveTo(-15,-30);ctx.quadraticCurveTo(0,-42,16,-30);
    ctx.lineTo(20,10);ctx.quadraticCurveTo(0,25,-20,10);ctx.closePath();ctx.fill();ctx.stroke();
    // head
    ctx.fillStyle='#16120f';ctx.beginPath();ctx.arc(0,-47,13,0,Math.PI*2);ctx.fill();ctx.stroke();
    // backpack
    ctx.fillStyle='#222a31';ctx.fillRect(-10,-28,21,24);ctx.strokeRect(-10,-28,21,24);
    // legs
    ctx.strokeStyle='#16181d';ctx.lineWidth=12;
    if(sliding){
      line(-6,15,-28,30,12,'#16181d');line(8,14,28,25,12,'#16181d');
      line(-28,30,-37,33,8,'#e9e5dc');line(28,25,38,27,8,'#e9e5dc');
    }else{
      line(-5,14,-11,43,12,'#16181d');line(8,13,13,45,12,'#16181d');
      line(-11,43,-18,51,8,'#e9e5dc');line(13,45,20,52,8,'#e9e5dc');
    }
    // arms
    line(-14,-20,-29,4,8,'#b62d28');line(14,-20,29,-2,8,'#b62d28');
    ctx.restore();
  }

  function drawUI(){
    ctx.save();
    ctx.fillStyle='#050608c8';ctx.fillRect(12,12,126,96);
    comicText('WYNIK',24,30,14,'left','#f5f0df');
    comicText(String(score).padStart(4,'0'),24,55,30,'left','#ffbd35');
    comicText('● '+coins,24,87,17,'left','#f5f0df');
    comicText(Math.floor(dist)+' m',88,87,16,'left','#f5f0df');

    // pause icon
    ctx.fillStyle='#050608c9';ctx.fillRect(W-58,14,44,44);
    ctx.fillStyle='#eee';ctx.fillRect(W-46,24,7,24);ctx.fillRect(W-32,24,7,24);

    if(gameOver){
      ctx.fillStyle='#000c';ctx.fillRect(0,0,W,H);
      comicText('KONIEC BIEGU',W/2,H*.43,34,'center','#ffbd35');
      comicText('dotknij, aby spróbować ponownie',W/2,H*.49,15,'center','#f5f0df');
    }
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawBackground(); drawObjects(); drawPlayer(); drawUI();
  }

  let last=performance.now();
  function frame(now){
    const dt=Math.min(.035,(now-last)/1000); last=now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  reset(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
